# Informational per-team tally of GitVote's published binding votes.
# Save as .github/workflows/gitvote-team-tally.yml on the default branch.
# Requires TEAM_READ_TOKEN with permission to read organization team members.
name: GitVote team tally

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  tally:
    if: >-
      startsWith(github.event.comment.body, '/count-vote') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TEAM_READ_TOKEN: ${{ secrets.TEAM_READ_TOKEN }}
        with:
          script: |
            const TEAMS = [
              { slug: 'tech-ops-voting', label: 'Primaries' },
              { slug: 'tech-ops-alternates', label: 'Alternates' },
            ];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const trigger = context.payload.comment;

            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: trigger.id, content: 'rocket'
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            // GitVote updates its "Vote status" comment. Use that comment as
            // the source of the binding vote and pending-member information.
            const voteComment = comments.filter(c =>
              c.user?.login?.toLowerCase() === 'git-vote' &&
              /^\s*#{1,6}\s*Vote status\b/im.test(c.body || '') &&
              /Binding votes\s*\(/i.test(c.body || '')
            ).sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

            if (!voteComment) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: 'No GitVote Vote status comment with binding votes was found here.'
              });
              return;
            }

            const votes = new Map();
            // Parse the published Markdown table under "Binding votes (N)".
            // Stop at the next heading; ignore the header/separator rows.
            const section = (voteComment.body || '').split(/Binding votes\s*\(\d+\)/i)[1] || '';
            for (const line of section.split('\n')) {
              if (/^\s*#{1,6}\s/.test(line)) break;
              if (!/^\s*\|/.test(line)) continue;
              const cells = line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(s => s.trim());
              if (cells.length < 2 || /^User$/i.test(cells[0]) || /^:?-{2,}/.test(cells[0])) continue;
              const login = cells[0].replace(/<[^>]*>/g, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[`*@]/g, '').trim();
              const raw = cells[1].replace(/[`*_]/g, '').trim().toLowerCase();
              const choice = { 'in favor': 'In favor', 'against': 'Against', 'abstain': 'Abstain', 'pending': 'Did not vote' }[raw];
              if (login && choice) votes.set(login.toLowerCase(), { login, choice });
            }
            if (!votes.size) {
              throw new Error('Found GitVote comment but could not parse its Binding votes table. Check the GitVote comment format.');
            }

            if (!process.env.TEAM_READ_TOKEN) {
              throw new Error('TEAM_READ_TOKEN secret is required to read organization teams.');
            }
            const orgClient = getOctokit(process.env.TEAM_READ_TOKEN);
            const onATeam = new Set();
            for (const t of TEAMS) {
              const members = await orgClient.paginate(orgClient.rest.teams.listMembersInOrg, {
                org: owner, team_slug: t.slug, per_page: 100
              });
              t.members = members.map(m => m.login).sort((a, b) => a.localeCompare(b));
              t.members.forEach(m => onATeam.add(m.toLowerCase()));
            }

            const fmt = logins => logins.length ? logins.map(l => '`' + l + '`').join(', ') : '–';
            const row = (label, logins) => `| ${label} | ${logins.length} | ${fmt(logins)} |`;
            let body = '### Vote results by team\n\n';
            body += '_Informational only. Based on GitVote’s published binding-vote table and current GitHub team membership. GitVote remains the official record._\n';
            for (const t of TEAMS) {
              body += `\n**${t.label}** (\`${t.slug}\`)\n\n| | Votes | Who |\n|---|---:|---|\n`;
              for (const choice of ['In favor', 'Against', 'Abstain', 'Did not vote']) {
                const who = t.members.filter(m => {
                  const vote = votes.get(m.toLowerCase());
                  return (vote?.choice || 'Did not vote') === choice;
                });
                body += row(choice, who) + '\n';
              }
            }
            const others = [...votes.values()].filter(v => !onATeam.has(v.login.toLowerCase()));
            if (others.length) {
              body += '\nPublished vote-table users outside the configured teams (not counted): ';
              body += fmt(others.map(v => v.login)) + '\n';
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
